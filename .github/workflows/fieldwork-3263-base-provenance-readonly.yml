name: Verify ShellCheck 3263 command-owned reference

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact reachable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: teamleaderleo/shellcheck
          ref: a1716be3b847dc23761d35137b43cef7752b3c1d
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: 9.6.6
          cabal-version: latest
          cabal-update: true

      - name: Apply command-owned reference candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a1716be3b847dc23761d35137b43cef7752b3c1d
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/ShellCheck/Analytics.hs')
          text = path.read_text()

          old_props = '''prop_subshellAssignmentCheck28 = verifyTree subshellAssignmentCheck "@test 'one' { foo=bar; }\\n@test 'two' { echo $foo; }\\n"
          subshellAssignmentCheck params t ='''
          new_props = '''prop_subshellAssignmentCheck28 = verifyTree subshellAssignmentCheck "@test 'one' { foo=bar; }\\n@test 'two' { echo $foo; }\\n"
          prop_subshellAssignmentCheck29 = verifyTree subshellAssignmentCheck "@test 'one' { foo=bar; }\\n@test 'two' { export foo+=baz; }\\n"
          prop_subshellAssignmentCheck30 = verifyTree subshellAssignmentCheck "@test 'one' { foo=bar; }\\n@test 'two' { export foo; }\\n"
          subshellAssignmentCheck params t ='''
          if text.count(old_props) != 1:
              raise SystemExit('unexpected property block')
          text = text.replace(old_props, new_props, 1)

          old_block = '''findSubshelled (Reference (_, readToken, str):rest) scopes deadVars = do
              unless (shouldIgnore readToken str) $ case Map.findWithDefault Alive str deadVars of
                  Alive -> return ()
                  Dead writeToken reason -> do
                              info (getId writeToken) 2030 $ "Modification of " ++ str ++ " is local (to subshell caused by "++ reason ++")."
                              info (getId readToken) 2031 $ str ++ " was modified in a subshell. That change might be lost."
              findSubshelled rest scopes deadVars
            where
              shouldIgnore readToken str =
                  str `elem` ["@", "*", "_", "IFS"] || isSyntheticAssignmentRead readToken str

              -- export/declare -x assignments are included in the general variable flow
              -- as references so they count as externally used. That synthetic reference
              -- is not a read of the previous value and must not trigger SC2030/SC2031.
              -- A real RHS read, as in `export foo=$foo`, has a dollar-expansion token and
              -- is deliberately not ignored here.
              isSyntheticAssignmentRead (T_Assignment _ _ name _ _) str = name == str
              isSyntheticAssignmentRead _ _ = False'''

          new_block = '''findSubshelled
              (Reference (_, readToken@(T_Assignment _ _ readName _ _), str):
+              assignment@(Assignment (base, writeToken, writeName, _)):
+              rest)
+              scopes
+              deadVars
+              | isSyntheticCommandReference base readToken writeToken readName str writeName =
+                  findSubshelled (assignment:rest) scopes deadVars
+            where
+              isSyntheticCommandReference
+                  T_SimpleCommand {}
+                  readToken
+                  writeToken
+                  readName
+                  referencedName
+                  writtenName =
+                      getId readToken == getId writeToken &&
+                      readName == referencedName &&
+                      referencedName == writtenName
+              isSyntheticCommandReference _ _ _ _ _ _ = False
+
+          findSubshelled (Reference (_, readToken, str):rest) scopes deadVars = do
+              unless (str `elem` ["@", "*", "_", "IFS"]) $ case Map.findWithDefault Alive str deadVars of
+                  Alive -> return ()
+                  Dead writeToken reason -> do
+                              info (getId writeToken) 2030 $ "Modification of " ++ str ++ " is local (to subshell caused by "++ reason ++")."
+                              info (getId readToken) 2031 $ str ++ " was modified in a subshell. That change might be lost."
+              findSubshelled rest scopes deadVars'''.replace('\n+', '\n')

          if text.count(old_block) != 1:
              raise SystemExit('unexpected analysis block')
          path.write_text(text.replace(old_block, new_block, 1))
          PY
          git diff --check

      - name: Run complete analyzer suite
        run: cabal v2-test test-shellcheck --test-show-details=direct

      - name: Build executable and run focused controls
        shell: bash
        run: |
          set -euo pipefail
          cabal v2-build exe:shellcheck
          BIN=$(cabal list-bin exe:shellcheck)
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          cat > "$tmp/literal.bats" <<'EOF'
          #!/usr/bin/env bats
          @test "one" { export foo=bar; }
          @test "two" { export foo=baz; }
          EOF
          ! "$BIN" -f gcc "$tmp/literal.bats" | grep -Eq 'SC2030|SC2031'

          cat > "$tmp/append.bats" <<'EOF'
          #!/usr/bin/env bats
          @test "one" { foo=bar; }
          @test "two" { export foo+=baz; }
          EOF
          set +e
          "$BIN" -f gcc "$tmp/append.bats" > "$tmp/append.txt"
          append_status=$?
          set -e
          test "$append_status" -ne 0
          grep -q 'SC2030' "$tmp/append.txt"
          grep -q 'SC2031' "$tmp/append.txt"

          cat > "$tmp/bare-export.bats" <<'EOF'
          #!/usr/bin/env bats
          @test "one" { foo=bar; }
          @test "two" { export foo; }
          EOF
          set +e
          "$BIN" -f gcc "$tmp/bare-export.bats" > "$tmp/bare-export.txt"
          bare_status=$?
          set -e
          test "$bare_status" -ne 0
          grep -q 'SC2030' "$tmp/bare-export.txt"
          grep -q 'SC2031' "$tmp/bare-export.txt"

      - name: Verify source was not published
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a1716be3b847dc23761d35137b43cef7752b3c1d
          git diff --check
          test "$(git diff --name-only)" = src/ShellCheck/Analytics.hs
