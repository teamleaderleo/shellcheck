name: Verify ShellCheck 3263 command-owned reference

on:
  pull_request:
    branches:
      - master
    paths:
      - fieldwork/3263/COMMAND_OWNED_REFERENCE_V2_TRIGGER.md

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out carrier generation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: teamleaderleo/shellcheck
          ref: ${{ github.event.pull_request.base.sha }}
          path: carrier
          persist-credentials: false

      - name: Check out exact reachable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: teamleaderleo/shellcheck
          ref: a1716be3b847dc23761d35137b43cef7752b3c1d
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: 9.6.6
          cabal-version: latest
          cabal-update: true

      - name: Run exact command-owned reference controls
        run: bash carrier/fieldwork/3263/run_command_owned_reference.sh candidate
