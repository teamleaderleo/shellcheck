name: Fieldwork ShellCheck 3263 base provenance repair

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fieldwork-3263-base-provenance-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: fieldwork/3263-bats-synthetic-export-read
          fetch-depth: 0

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: 9.6.6
          cabal-version: latest
          cabal-update: true

      - name: Apply base-provenance repair and execute
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/ShellCheck/Analytics.hs')
          text = path.read_text()

          old_props = '''prop_subshellAssignmentCheck28 = verifyTree subshellAssignmentCheck "@test 'one' { foo=bar; }\\n@test 'two' { echo $foo; }\\n"
          subshellAssignmentCheck params t ='''
          new_props = '''prop_subshellAssignmentCheck28 = verifyTree subshellAssignmentCheck "@test 'one' { foo=bar; }\\n@test 'two' { echo $foo; }\\n"
          prop_subshellAssignmentCheck29 = verifyTree subshellAssignmentCheck "@test 'one' { foo=bar; }\\n@test 'two' { export foo+=baz; }\\n"
          subshellAssignmentCheck params t ='''
          if text.count(old_props) != 1:
              raise SystemExit('unexpected property block')
          text = text.replace(old_props, new_props, 1)

          old_block = '''findSubshelled (Reference (_, readToken, str):rest) scopes deadVars = do
              unless (shouldIgnore readToken str) $ case Map.findWithDefault Alive str deadVars of
                  Alive -> return ()
                  Dead writeToken reason -> do
                              info (getId writeToken) 2030 $ "Modification of " ++ str ++ " is local (to subshell caused by "++ reason ++")."
                              info (getId readToken) 2031 $ str ++ " was modified in a subshell. That change might be lost."
              findSubshelled rest scopes deadVars
            where
              shouldIgnore readToken str =
                  str `elem` ["@", "*", "_", "IFS"] || isSyntheticAssignmentRead readToken str

              -- export/declare -x assignments are included in the general variable flow
              -- as references so they count as externally used. That synthetic reference
              -- is not a read of the previous value and must not trigger SC2030/SC2031.
              -- A real RHS read, as in `export foo=$foo`, has a dollar-expansion token and
              -- is deliberately not ignored here.
              isSyntheticAssignmentRead (T_Assignment _ _ name _ _) str = name == str
              isSyntheticAssignmentRead _ _ = False'''

          new_block = '''findSubshelled (Reference (base, readToken, str):rest) scopes deadVars = do
              unless (shouldIgnore base readToken str) $ case Map.findWithDefault Alive str deadVars of
                  Alive -> return ()
                  Dead writeToken reason -> do
                              info (getId writeToken) 2030 $ "Modification of " ++ str ++ " is local (to subshell caused by "++ reason ++")."
                              info (getId readToken) 2031 $ str ++ " was modified in a subshell. That change might be lost."
              findSubshelled rest scopes deadVars
            where
              shouldIgnore base readToken str =
                  str `elem` ["@", "*", "_", "IFS"] || isSyntheticAssignmentRead base readToken str

              -- Export/declaration replacement assignments add one synthetic external-use
              -- reference whose enclosing flow base is the simple command. The assignment
              -- token alone is not enough: append and arithmetic assignments also read the
              -- previous value and must remain eligible for SC2030/SC2031.
              isSyntheticAssignmentRead
                  (T_SimpleCommand _ _ _)
                  (T_Assignment _ Assign name _ _)
                  str = name == str
              isSyntheticAssignmentRead _ _ _ = False'''

          if text.count(old_block) != 1:
              raise SystemExit('unexpected analysis block')
          path.write_text(text.replace(old_block, new_block, 1))
          PY

          git diff --check
          cabal update
          cabal v2-test test-shellcheck --test-show-details=direct
          cabal v2-build exe:shellcheck
          BIN=$(cabal list-bin exe:shellcheck)

          tmp=$(mktemp -d)
          cat > "$tmp/literal.bats" <<'EOF'
          #!/usr/bin/env bats
          @test "one" { export foo=bar; }
          @test "two" { export foo=baz; }
          EOF
          ! "$BIN" -f gcc "$tmp/literal.bats" | grep -Eq 'SC2030|SC2031'

          cat > "$tmp/append.bats" <<'EOF'
          #!/usr/bin/env bats
          @test "one" { foo=bar; }
          @test "two" { export foo+=baz; }
          EOF
          set +e
          "$BIN" -f gcc "$tmp/append.bats" > "$tmp/append.txt"
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'SC2030' "$tmp/append.txt"
          grep -q 'SC2031' "$tmp/append.txt"

          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add src/ShellCheck/Analytics.hs
          git commit -m "Distinguish synthetic export reads by flow provenance"
          git push origin HEAD:fieldwork/3263-bats-synthetic-export-read

  retire:
    if: always()
    needs: repair
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Retire carrier
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/workflows/fieldwork-3263-base-provenance-repair.yml; then
            git config user.name fieldwork-bot
            git config user.email fieldwork-bot@users.noreply.github.com
            git rm .github/workflows/fieldwork-3263-base-provenance-repair.yml
            git commit -m "Retire ShellCheck 3263 base-provenance carrier"
            git push origin HEAD:master
          fi
