name: Build ShellCheck

# Run this workflow every time a new commit pushed to your repository
on: [push, pull_request]

jobs:
  materialize_3263:
    name: Materialize tested ShellCheck 3263 repair
    if: github.event_name == 'pull_request' && github.head_ref == 'execution/3263-materialize-registered-carrier'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check out immutable tested carrier
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/shellcheck
          ref: b6dbe06d033f67b472450b59cacd9175f8b6ef31
          path: carrier
          persist-credentials: false

      - name: Check out exact canonical source
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/shellcheck
          ref: a1716be3b847dc23761d35137b43cef7752b3c1d
          path: candidate
          fetch-depth: 0

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: 9.6.6
          cabal-version: latest
          cabal-update: true

      - name: Re-run exact tested repair and publish fork branch
        shell: bash
        run: |
          set -euo pipefail
          bash carrier/fieldwork/3263/run_command_owned_reference.sh candidate
          cd candidate
          mkdir -p fieldwork/3263
          git diff 9af7ee28ce587baadd950b85dd6826a16b9c068d -- src/ShellCheck/Analytics.hs > fieldwork/3263/candidate.patch
          python3 - <<'PY'
          from pathlib import Path
          import os
          receipt = Path('fieldwork/3263/receipt.md')
          prior = receipt.read_text() if receipt.exists() else '# ShellCheck 3263 execution receipts\n'
          addition = f'''

## Command-owned adjacency repair

- Workflow run: https://github.com/teamleaderleo/shellcheck/actions/runs/{os.environ['GITHUB_RUN_ID']}
- Starting canonical head: `a1716be3b847dc23761d35137b43cef7752b3c1d`
- Tested carrier commit: `b6dbe06d033f67b472450b59cacd9175f8b6ef31`
- Full `cabal v2-test test-shellcheck --test-show-details=direct` passed.
- `exe:shellcheck` built successfully.
- Literal replacement export emitted no SC2030/SC2031.
- Append export retained SC2030 and SC2031.
- Bare export retained SC2030 and SC2031.
- `git diff --check` passed.
- Evidence class: target-executed on Ubuntu 24.04 with GHC 9.6.6; broader compiler/OS matrix not run.
'''
          if '## Command-owned adjacency repair' not in prior:
              receipt.write_text(prior.rstrip() + addition + '\n')
          PY
          git diff --check
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add src/ShellCheck/Analytics.hs fieldwork/3263/candidate.patch fieldwork/3263/receipt.md
          git commit -m "Preserve real reads in Bats export diagnostics"
          git push origin HEAD:fieldwork/3263-bats-synthetic-export-read

      - name: Check out cleanup branch
        if: always()
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/shellcheck
          ref: master
          path: cleanup
          fetch-depth: 0

      - name: Restore registered workflow and retire carriers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd cleanup
          git pull --ff-only origin master
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git checkout 8dd5460f9f7d2191858e253ccb23d5e77d0c7718 -- .github/workflows/build.yml
          for path in \
            .github/workflows/fieldwork-3263-base-provenance-readonly.yml \
            .github/workflows/fieldwork-3263-materialize-tested-repair.yml
          do
            if test -f "$path"; then
              git rm "$path"
            fi
          done
          git commit -m "Retire ShellCheck 3263 materialization carriers"
          git push origin HEAD:master

  package_source:
    name: Package Source Code
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-mark manual ghc # Don't bother installing ghc just to tar up source
          sudo apt-get install cabal-install

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Deduce tags
        run: |
          mkdir source
          echo "latest" > source/tags
          if tag=$(git describe --exact-match --tags)
          then
            echo "stable" >> source/tags
            echo "$tag" >> source/tags
          fi
          cat source/tags

      - name: Package Source
        run: |
          grep "stable" source/tags || ./setgitversion
          cabal sdist
          mv dist-newstyle/sdist/*.tar.gz source/source.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: source
          path: source/

  run_tests:
    name: Run tests (GHC ${{ matrix.ghc }})
    needs: package_source
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghc: ['8.0', '8.10', '9.0.1', '9.4.7', '9.6.6', 'latest']
        include:
          - ghc: 'latest'
            cabal_flags: '--allow-newer'
      # If one version fails, we still want the status of the others
      fail-fast: false
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: source
          path: source/

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}

      - name: Unpack source
        run: |
          cd source
          tar xvf source.tar.gz --strip-components=1

      - name: Build and run tests
        run: |
          cd source
          cabal test ${{ matrix.cabal_flags }}

  build_source:
    name: Build
    needs: package_source
    strategy:
      matrix:
        build: [linux.x86_64, linux.aarch64, linux.armv6hf, linux.riscv64, darwin.x86_64, darwin.aarch64, windows.x86_64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: source
          path: source/

      - name: Build source
        run: |
          mkdir -p bin
          mkdir -p bin/${{matrix.build}}
          ( cd bin && ../builders/run_builder ../source/source.tar.gz ../builders/${{matrix.build}} )

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.build}}.bin
          path: bin/

  package_binary:
    name: Package Binaries
    needs: build_source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: List files for debugging
        run: find .

      - name: Work around GitHub permissions bug
        run: chmod +x *.bin/*/shellcheck*

      - name: Package binaries
        run: |
          export TAGS="$(cat source/tags)"
          mkdir -p deploy
          cp -r *.bin/* deploy
          cd deploy
          ../.prepare_deploy
          rm -rf */ README* LICENSE*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: deploy
          path: deploy/

  deploy:
    if: github.event_name == 'push'
    name: Deploy binaries
    needs: package_binary
    runs-on: ubuntu-latest
    environment: Deploy
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install hub

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download artifacts (source)
        uses: actions/download-artifact@v8
        with:
          name: source
          path: source/

      - name: Download artifacts (binaries)
        uses: actions/download-artifact@v8
        with:
          name: deploy
          path: deploy/

      - name: Upload to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export TAGS="$(cat source/tags)"
          ./.github_deploy

      - name: Waiting for GitHub to replicate uploaded releases
        run: |
          sleep 300

      - name: Upload to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_EMAIL: ${{ secrets.DOCKER_EMAIL }}
          DOCKER_BASE: ${{ secrets.DOCKER_USERNAME }}/shellcheck
        run: |
          export TAGS="$(cat source/tags)"
          ( source ./.multi_arch_docker && set -eux && multi_arch_docker::main )
