name: Fieldwork ShellCheck 3263 structural repair

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'execution/3263-append-repair'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out canonical candidate
        uses: actions/checkout@v4
        with:
          ref: fieldwork/3263-bats-synthetic-export-read
          path: candidate
          fetch-depth: 0

      - name: Check out default branch for retirement
        uses: actions/checkout@v4
        with:
          ref: master
          path: default
          fetch-depth: 0

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.6'
          cabal-version: latest

      - name: Apply and validate structural repair
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/ShellCheck/Analytics.hs')
          text = path.read_text()

          old_props = '''prop_subshellAssignmentCheck28 = verifyTree subshellAssignmentCheck "@test 'one' { foo=bar; }\\n@test 'two' { echo $foo; }\\n"
          subshellAssignmentCheck params t ='''
          new_props = '''prop_subshellAssignmentCheck28 = verifyTree subshellAssignmentCheck "@test 'one' { foo=bar; }\\n@test 'two' { echo $foo; }\\n"
          prop_subshellAssignmentCheck29 = verifyTree subshellAssignmentCheck "@test 'one' { foo=bar; }\\n@test 'two' { export foo+=baz; }\\n"
          subshellAssignmentCheck params t ='''
          if text.count(old_props) != 1:
              raise SystemExit('unexpected property block')
          text = text.replace(old_props, new_props, 1)

          old_block = '''findSubshelled (Reference (_, readToken, str):rest) scopes deadVars = do
              unless (shouldIgnore readToken str) $ case Map.findWithDefault Alive str deadVars of
                  Alive -> return ()
                  Dead writeToken reason -> do
                              info (getId writeToken) 2030 $ "Modification of " ++ str ++ " is local (to subshell caused by "++ reason ++")."
                              info (getId readToken) 2031 $ str ++ " was modified in a subshell. That change might be lost."
              findSubshelled rest scopes deadVars
            where
              shouldIgnore readToken str =
                  str `elem` ["@", "*", "_", "IFS"] || isSyntheticAssignmentRead readToken str

              -- export/declare -x assignments are included in the general variable flow
              -- as references so they count as externally used. That synthetic reference
              -- is not a read of the previous value and must not trigger SC2030/SC2031.
              -- A real RHS read, as in `export foo=$foo`, has a dollar-expansion token and
              -- is deliberately not ignored here.
              isSyntheticAssignmentRead (T_Assignment _ _ name _ _) str = name == str
              isSyntheticAssignmentRead _ _ = False'''

          new_block = '''findSubshelled (Reference (_, readToken, str):rest) scopes deadVars = do
              unless (shouldIgnore readToken str rest) $ case Map.findWithDefault Alive str deadVars of
                  Alive -> return ()
                  Dead writeToken reason -> do
                              info (getId writeToken) 2030 $ "Modification of " ++ str ++ " is local (to subshell caused by "++ reason ++")."
                              info (getId readToken) 2031 $ str ++ " was modified in a subshell. That change might be lost."
              findSubshelled rest scopes deadVars
            where
              shouldIgnore readToken str flow =
                  str `elem` ["@", "*", "_", "IFS"] || isSyntheticAssignmentRead readToken str flow

              -- export/declare -x assignments are included in the general variable flow
              -- as references so they count as externally used. For replacement assignments,
              -- that synthetic reference is the last matching reference before the matching
              -- assignment. Append assignments add an earlier identical reference for their
              -- genuine read; real RHS reads use their own expansion token.
              isSyntheticAssignmentRead readToken str flow =
                  case break (isMatchingAssignment readToken str) flow of
                      (before, Assignment _:_) ->
                          not $ any (isMatchingReference readToken str) before
                      _ -> False

              isMatchingAssignment readToken str (Assignment (_, writeToken, name, _)) =
                  getId readToken == getId writeToken && str == name
              isMatchingAssignment _ _ _ = False

              isMatchingReference readToken str (Reference (_, otherToken, name)) =
                  getId readToken == getId otherToken && str == name
              isMatchingReference _ _ _ = False'''

          if text.count(old_block) != 1:
              raise SystemExit('unexpected analysis block')
          path.write_text(text.replace(old_block, new_block, 1))
          PY

          cabal update
          cabal v2-test test-shellcheck --test-show-details=direct
          cabal v2-build exe:shellcheck
          BIN=$(cabal list-bin exe:shellcheck)

          mkdir -p fieldwork/3263/results
          "$BIN" -f gcc fieldwork/3263/original.bats > fieldwork/3263/results/structural-literal.txt 2>&1 || true
          ! grep -Eq 'SC2030|SC2031' fieldwork/3263/results/structural-literal.txt

          cat > fieldwork/3263/results/structural-append.bats <<'EOF'
          #!/usr/bin/env bats
          @test "one" { foo=bar; }
          @test "two" { export foo+=baz; }
          EOF
          set +e
          "$BIN" -f gcc fieldwork/3263/results/structural-append.bats > fieldwork/3263/results/structural-append.txt 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'SC2030' fieldwork/3263/results/structural-append.txt
          grep -q 'SC2031' fieldwork/3263/results/structural-append.txt
          git diff --check

          cat >> fieldwork/3263/receipt.md <<EOF

          ## Structural append-read repair

          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Starting candidate head: $(git rev-parse HEAD)
          - Synthetic export references are identified as the last matching reference before their matching assignment.
          - Append assignments retain their earlier duplicate reference as a genuine read.
          - Full \`cabal v2-test test-shellcheck\` and focused literal/append controls passed on Ubuntu with GHC 9.6.6.
          - Evidence class: target-executed on one Linux/GHC configuration.
          EOF

          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add src/ShellCheck/Analytics.hs fieldwork/3263
          git commit -m "Preserve append reads in Bats subshell diagnostics"
          git push origin HEAD:fieldwork/3263-bats-synthetic-export-read

      - name: Retire carrier workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd default
          if test -f .github/workflows/fieldwork-3263-structural-repair.yml; then
            git config user.name fieldwork-bot
            git config user.email fieldwork-bot@users.noreply.github.com
            git rm .github/workflows/fieldwork-3263-structural-repair.yml
            git commit -m "Retire ShellCheck 3263 structural repair carrier"
            git push origin HEAD:master
          fi
