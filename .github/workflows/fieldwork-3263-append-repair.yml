name: Fieldwork ShellCheck 3263 append-read repair

on:
  push:
    branches:
      - fieldwork/3263-bats-synthetic-export-read
    paths:
      - .github/workflows/fieldwork-3263-append-repair.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.6'
          cabal-version: 'latest'

      - name: Repair synthetic-reference discriminator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/ShellCheck/Analytics.hs')
          text = path.read_text()

          old_props = '''prop_subshellAssignmentCheck28 = verifyTree subshellAssignmentCheck "@test 'one' { foo=bar; }\\n@test 'two' { echo $foo; }\\n"\nsubshellAssignmentCheck params t ='''
          new_props = '''prop_subshellAssignmentCheck28 = verifyTree subshellAssignmentCheck "@test 'one' { foo=bar; }\\n@test 'two' { echo $foo; }\\n"\nprop_subshellAssignmentCheck29 = verifyTree subshellAssignmentCheck "@test 'one' { foo=bar; }\\n@test 'two' { export foo+=baz; }\\n"\nsubshellAssignmentCheck params t ='''
          if text.count(old_props) != 1:
              raise SystemExit('unexpected property block')
          text = text.replace(old_props, new_props, 1)

          old_pattern = 'findSubshelled (Reference (_, readToken, str):rest) scopes deadVars = do'
          new_pattern = 'findSubshelled (Reference (base, readToken, str):rest) scopes deadVars = do'
          if text.count(old_pattern) != 1:
              raise SystemExit('unexpected reference pattern')
          text = text.replace(old_pattern, new_pattern, 1)

          old_call = '    unless (shouldIgnore readToken str) $ case Map.findWithDefault Alive str deadVars of'
          new_call = '    unless (shouldIgnore base readToken str) $ case Map.findWithDefault Alive str deadVars of'
          if text.count(old_call) != 1:
              raise SystemExit('unexpected shouldIgnore call')
          text = text.replace(old_call, new_call, 1)

          old_helper = '''    shouldIgnore readToken str =\n        str `elem` ["@", "*", "_", "IFS"] || isSyntheticAssignmentRead readToken str\n\n    -- export/declare -x assignments are included in the general variable flow\n    -- as references so they count as externally used. That synthetic reference\n    -- is not a read of the previous value and must not trigger SC2030/SC2031.\n    -- A real RHS read, as in `export foo=$foo`, has a dollar-expansion token and\n    -- is deliberately not ignored here.\n    isSyntheticAssignmentRead (T_Assignment _ _ name _ _) str = name == str\n    isSyntheticAssignmentRead _ _ = False'''
          new_helper = '''    shouldIgnore base readToken str =\n        str `elem` ["@", "*", "_", "IFS"] || isSyntheticAssignmentRead base readToken str\n\n    -- export/declare -x assignments are included in the general variable flow\n    -- as references so they count as externally used. That synthetic reference\n    -- has the simple command as its base and is not a read of the previous value.\n    -- A real RHS read has its expansion token, while `foo+=bar` has the assignment\n    -- itself as its base; both deliberately remain visible to SC2030/SC2031.\n    isSyntheticAssignmentRead T_SimpleCommand{} (T_Assignment _ _ name _ _) str = name == str\n    isSyntheticAssignmentRead _ _ _ = False'''
          if text.count(old_helper) != 1:
              raise SystemExit('unexpected helper block')
          text = text.replace(old_helper, new_helper, 1)
          path.write_text(text)
          PY
          git diff --check

      - name: Execute full analyzer suite and focused controls
        shell: bash
        run: |
          set -euo pipefail
          cabal update
          cabal v2-test test-shellcheck --test-show-details=direct
          cabal v2-build exe:shellcheck
          BIN=$(cabal list-bin exe:shellcheck)
          mkdir -p fieldwork/3263/results

          "$BIN" -f gcc fieldwork/3263/original.bats \
            > fieldwork/3263/results/append-repair-literal.txt 2>&1 || true
          ! grep -Eq 'SC2030|SC2031' fieldwork/3263/results/append-repair-literal.txt

          cat > fieldwork/3263/results/append-control.bats <<'EOF'
          #!/usr/bin/env bats
          @test "one" { foo=bar; }
          @test "two" { export foo+=baz; }
          EOF
          set +e
          "$BIN" -f gcc fieldwork/3263/results/append-control.bats \
            > fieldwork/3263/results/append-repair-append.txt 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'SC2030' fieldwork/3263/results/append-repair-append.txt
          grep -q 'SC2031' fieldwork/3263/results/append-repair-append.txt
          git diff --check

      - name: Retain repair receipt and retire carrier
        shell: bash
        run: |
          set -euo pipefail
          cat >> fieldwork/3263/receipt.md <<EOF

          ## Append-read self-review repair

          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Starting head: ${GITHUB_SHA}
          - Self-review found that the first implementation also ignored the genuine read represented by \`export foo+=bar\`.
          - The repaired discriminator now requires the reference base to be the enclosing simple command; append reads use the assignment itself as their base and remain visible.
          - Full \`cabal v2-test test-shellcheck\` passed on Ubuntu with GHC 9.6.6.
          - Literal replacement exports remain clean; the cross-test append control emits SC2030 and SC2031.
          - Evidence class: target-executed on one Linux/GHC configuration.
          EOF
          rm .github/workflows/fieldwork-3263-append-repair.yml
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add src/ShellCheck/Analytics.hs fieldwork/3263 .github/workflows/fieldwork-3263-append-repair.yml
          git commit -m "Preserve append reads in Bats subshell diagnostics"
          git push origin HEAD:fieldwork/3263-bats-synthetic-export-read
